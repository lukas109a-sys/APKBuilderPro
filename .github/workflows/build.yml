name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK & Build Tools
      uses: android-actions/setup-android@v3

    - name: Setup Project Structure & Build
      run: |
        echo "include ':'" > settings.gradle
        echo "rootProject.name = 'APKBuilderPro'" >> settings.gradle
        
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.1.1" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }
        EOF

        mkdir -p app/src/main/java/com/lucas/apkbuilder
        
        # Mover os ficheiros para a estrutura correta
        mv *.kt app/src/main/java/com/lucas/apkbuilder/
        mv AndroidManifest.xml app/src/main/

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.lucas.apkbuilder"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.lucas.apkbuilder"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.10.0")
        }
        EOF

        # Aceitar licenças do Android SDK e compilar usando gradle instalado no sistema
        yes | sdkmanager --licenses || true
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APKBuilderPro-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
